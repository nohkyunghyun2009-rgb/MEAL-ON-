name: meal_on
description: "MEAL:ON - 백마 학원가 학생 식당 예약 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0   # 결제 승인 서버에 요청 보낼 때
  web: ^1.1.0    # 웹에서 주소창·브라우저 저장소 다룰 때 (토스 결제 리다이렉트용)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 홈 배너 간판 사진 폴더 — 여기에 사진 파일을 넣고 promo_banner_data.dart 에서 경로를 적어요
  assets:
    - assets/banners/
